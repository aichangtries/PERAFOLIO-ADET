<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeraFolio Prototype</title><style>:root{--bg:#0c0812;--s:#17111f;--l:#332442;--p:#a449e0;--m:#ad9bb9;--g:#47d6a1}*{box-sizing:border-box}body{margin:0;background:#050307;color:#faf7ff;font:15px Arial,sans-serif}.app{max-width:540px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:88px}.top{padding:30px 22px 18px;display:flex;justify-content:space-between}.ey{color:var(--p);font-size:11px;font-weight:bold;letter-spacing:.15em}.top h2{margin:5px 0;font-size:24px}.avatar,.back{border:0;background:none;color:var(--m)}main{padding:12px 20px}.card{padding:25px;border-radius:22px;background:linear-gradient(135deg,#3d1558,#812db2)}.card span,.card small{display:block;color:#e6c9f5}.card strong{display:block;font-size:32px;margin:9px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.actions button,.row,.option{border:1px solid var(--l);background:var(--s);color:#fff;border-radius:15px;padding:15px}.actions button{color:var(--m);font-weight:bold}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.section button{border:0;background:none;color:var(--p)}.accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:1px solid var(--l);border-radius:17px;background:var(--s);padding:16px}.mini small,.row small{display:block;color:var(--m);font-size:12px;margin-top:8px}.activity{display:grid;gap:2px}.row{display:flex;gap:12px;align-items:center;border-width:0 0 1px;border-radius:0}.row div{flex:1}.in{color:var(--g)}.nav{position:fixed;bottom:0;width:min(100%,540px);display:flex;justify-content:space-around;background:#120c18ee;padding:16px}.nav button{background:none;border:0;color:var(--m)}.nav .active{color:var(--p)}.screen{padding:34px 28px}.screen h1{font-size:42px;line-height:1.05}.lede{color:var(--m);line-height:1.6}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:bold;margin-top:20px}.option{display:flex;gap:12px;align-items:center;margin:10px 0}.option.selected{border-color:var(--p)}input,select{width:100%;padding:14px;margin:8px 0 15px;background:var(--s);border:1px solid var(--l);border-radius:13px;color:#fff}.success{text-align:center;padding-top:30vh}.success b{display:grid;place-items:center;margin:auto auto 25px;width:85px;height:85px;border:1px solid var(--g);border-radius:50%;color:var(--g);font-size:35px}</style></head><body><div id="app" class="app"></div><script>const app=document.querySelector('#app');let screen='home',tab='home';const accounts=[['Main bank account','Checking','₱42,580.00'],['Daily wallet','E-wallet','₱8,250.00']];const tx=[['Coffee Project','Today, 9:42 AM','−₱185.00'],['Salary deposit','Yesterday','+₱32,000.00'],['Grocery run','Mar 18, 2026','−₱2,450.75']];function render(){if(screen==='home')home();else if(screen==='accounts')accountsPage();else if(screen==='transactions')transactions();else if(screen==='transfer')form('Transfer money','Send money','Review transfer');else if(screen==='pay')form('Pay','Pay a bill or merchant','Confirm payment');else if(screen==='success')success()}function shell(content){app.innerHTML=content+`<nav class="nav"><button class="${tab==='home'?'active':''}" onclick="go('home')">⌂<br>Home</button><button class="${tab==='accounts'?'active':''}" onclick="go('accounts')">▣<br>Accounts</button><button class="${tab==='transactions'?'active':''}" onclick="go('transactions')">≡<br>Activity</button></nav>`}function home(){shell(`<header class="top"><div><div class="ey">PERAFOLIO</div><h2>Good morning, Alex</h2></div><button class="avatar">⚙</button></header><main><div class="card"><span>Total balance</span><strong>₱50,830.00</strong><small>+8.4% this month</small></div><div class="actions"><button onclick="go('transfer')">↗<br>Transfer</button><button onclick="go('pay')">▣<br>Pay</button><button onclick="go('accounts')">＋<br>Add account</button></div><div class="section"><b>Your accounts</b><button onclick="go('accounts')">See all</button></div><div class="accounts">${accounts.map(a=>`<article class="mini"><small>${a[1]}</small><strong>${a[2]}</strong><small>${a[0]}</small></article>`).join('')}</div><div class="section"><b>Recent activity</b><button onclick="go('transactions')">See all</button></div><div class="activity">${tx.map(t=>`<div class="row"><div>◉</div><div><b>${t[0]}</b><small>${t[1]}</small></div><strong class="${t[2][0]=='+'?'in':''}">${t[2]}</strong></div>`).join('')}</div></main>`)}function accountsPage(){shell(`<header class="top"><div><div class="ey">PERAFOLIO</div><h2>Accounts</h2></div></header><main><div class="section"><b>Connected accounts</b><button>＋ Add</button></div>${accounts.map(a=>`<div class="option"><span>◉</span><div style="flex:1"><b>${a[0]}</b><small>${a[1]}</small></div><strong>${a[2]}</strong></div>`).join('')}</main>`)}function transactions(){shell(`<header class="top"><div><div class="ey">PERAFOLIO</div><h2>Transactions</h2></div></header><main><div class="activity">${tx.map(t=>`<div class="row"><div>◉</div><div><b>${t[0]}</b><small>${t[1]}</small></div><strong class="${t[2][0]=='+'?'in':''}">${t[2]}</strong></div>`).join('')}</div></main>`)}function form(title,heading,button){app.innerHTML=`<div class="screen"><button class="back" onclick="go('home')">← Back</button><div class="ey">PERAFOLIO</div><h1>${heading}</h1><p class="lede">Move money securely with a clear review before confirmation.</p><label>Recipient<input value="${title==='Pay'?'Coffee Project':'Maria Santos'}"></label><label>Amount<input value="2500" inputmode="decimal"></label><button class="primary" onclick="go('success')">${button} →</button></div>`}function success(){app.innerHTML=`<div class="screen success"><b>✓</b><div class="ey">TRANSACTION SUCCESS</div><h1>All done</h1><p class="lede">Your transaction was completed and securely recorded.</p><button class="primary" onclick="go('home')">Back to home</button></div>`}function go(next){screen=next;tab=next;render()}render()</script></body></html>
